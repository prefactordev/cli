name: Spec sync

# Each day, fetches the OpenAPI document the live Prefactor API serves and
# compares it with api/openapi.json. When they differ, regenerates the client
# and opens (or updates) a pull request from the spec-sync branch. The pull
# request's CI shows what the change breaks: the coverage check fails for a
# new or removed operation, the request field check for a new request field,
# and the build for a renamed or removed field. Run the api-drift skill on the
# branch to plan the fix.
#
# api/openapi.json holds the document with its keys sorted (jq -S), so a
# change in the order the API writes keys is not a change.
#
# SPEC_SYNC_PR_TOKEN is a fine-grained token for this repository only, with
# read and write access to contents and pull requests. Pull requests opened
# with GITHUB_TOKEN do not run CI.

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-sync

env:
  SPEC_URL: https://app.prefactorai.com/api/v1/openapi

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the live OpenAPI document
        id: fetch
        run: |
          curl -fsSL --retry 3 "$SPEC_URL" | jq -S . > "$RUNNER_TEMP/openapi.json"
          jq -e '.paths | length > 0' "$RUNNER_TEMP/openapi.json" > /dev/null
          echo "fetched_at=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_OUTPUT"
          if cmp -s "$RUNNER_TEMP/openapi.json" api/openapi.json; then
            echo "api/openapi.json matches $SPEC_URL."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v6
        if: steps.fetch.outputs.changed == 'true'
        with:
          go-version-file: go.mod
      - name: Update the document and regenerate the client
        if: steps.fetch.outputs.changed == 'true'
        env:
          FETCHED_AT: ${{ steps.fetch.outputs.fetched_at }}
        run: |
          go run ./tools/specdigest api/openapi.json > "$RUNNER_TEMP/before.txt"
          cp "$RUNNER_TEMP/openapi.json" api/openapi.json
          go run ./tools/specdigest api/openapi.json > "$RUNNER_TEMP/after.txt"
          if go generate ./... 2> "$RUNNER_TEMP/generate.txt"; then
            generated=yes
          else
            generated=no
          fi
          {
            echo "Updates \`api/openapi.json\` to the document served at $SPEC_URL on $FETCHED_AT."
            echo
            if [ "$generated" = no ]; then
              echo "**\`go generate\` failed**, so the client is not regenerated:"
              echo
              echo '```'
              tail -n 40 "$RUNNER_TEMP/generate.txt"
              echo '```'
              echo
            fi
            echo "CI on this pull request shows which commands need to change. Run the api-drift skill on this branch to plan the fix."
            echo
            echo "<details><summary>Operation digest diff</summary>"
            echo
            echo '```diff'
            diff -u "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt" | tail -n +3 | head -n 400 || true
            echo '```'
            echo
            echo "</details>"
          } > "$RUNNER_TEMP/body.md"
      - uses: peter-evans/create-pull-request@v7
        if: steps.fetch.outputs.changed == 'true'
        with:
          token: ${{ secrets.SPEC_SYNC_PR_TOKEN }}
          branch: spec-sync
          delete-branch: true
          commit-message: Update the OpenAPI document to the live API (${{ steps.fetch.outputs.fetched_at }})
          title: Update the OpenAPI document to the live API
          body-path: ${{ runner.temp }}/body.md
