name: Release

# Pushing a vX.Y.Z tag builds the archives as a draft release, smoke tests
# them on every platform, then publishes the release as the latest, which
# the stable channel installs. Release notes are GitHub's generated notes,
# which list the merged pull requests.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check the version continues from the TypeScript CLI
        run: |
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags are vX.Y.Z, got $tag." >&2
            exit 1
          fi
          # v0.6.1 was the TypeScript CLI's last release. Versions must keep
          # increasing for the people who update from it.
          if [ "$(printf '%s\n' v0.6.1 "$tag" | sort -V | tail -1)" != "$tag" ] || [ "$tag" = v0.6.1 ]; then
            echo "$tag must be newer than v0.6.1, the TypeScript CLI's last release." >&2
            exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

  smoke:
    needs: build
    uses: ./.github/workflows/smoke.yml
    with:
      tag: ${{ github.ref_name }}

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A release published with GITHUB_TOKEN does not start other
      # workflows, so start the install check here.
      - name: Verify the published release installs
        run: gh workflow run verify-install.yml --repo "$GITHUB_REPOSITORY" -f tag="$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
